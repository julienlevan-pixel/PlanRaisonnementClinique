openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: API de PRC Pharmacie
servers:
  - url: /api
    description: Base API path
tags:
  - name: auth
  - name: teachers
  - name: prcs
  - name: activities
  - name: participants
  - name: demonstrations
security:
  - teacherSession: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      security: []
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current user and CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /auth/login:
    post:
      operationId: login
      security: []
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated teacher
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
  /teachers:
    get:
      operationId: listTeachers
      tags: [teachers]
      responses:
        "200":
          description: Teacher accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Teacher"
    post:
      operationId: createTeacher
      tags: [teachers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherInput"
      responses:
        "201":
          description: Teacher created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"
  /teachers/{teacherId}:
    patch:
      operationId: updateTeacher
      tags: [teachers]
      parameters:
        - in: path
          name: teacherId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherUpdate"
      responses:
        "200":
          description: Teacher updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Teacher"
  /workspace/summary:
    get:
      operationId: getWorkspaceSummary
      tags: [prcs]
      responses:
        "200":
          description: Dashboard totals and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSummary"
  /prcs:
    get:
      operationId: listPrcs
      parameters:
        - in: query
          name: q
          description: Recherche sur le nom et le scénario du PRC appartenant au compte courant.
          schema: { type: string, maxLength: 160 }
        - in: query
          name: archived
          description: false pour la bibliothèque active, true pour les archives.
          schema: { type: boolean, default: false }
      tags: [prcs]
      responses:
        "200":
          description: PRCs owned by the current teacher
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prc"
    post:
      operationId: createPrc
      tags: [prcs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrcInput"
      responses:
        "201":
          description: PRC created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prc"
  /prcs/{prcId}:
    get:
      operationId: getPrc
      tags: [prcs]
      parameters:
        - in: path
          name: prcId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PRC and editable clinical content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrcDetail"
    put:
      operationId: updatePrc
      tags: [prcs]
      parameters:
        - in: path
          name: prcId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrcInput"
      responses:
        "200":
          description: PRC saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrcDetail"
    patch:
      operationId: archivePrc
      tags: [prcs]
      description: Archive ou restaure un PRC sans supprimer son historique.
      parameters:
        - in: path
          name: prcId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArchiveInput" }
      responses:
        "200":
          description: Statut d’archivage enregistré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArchiveResult" }
    delete:
      operationId: deletePrc
      tags: [prcs]
      description: Suppression définitive réservée au propriétaire, y compris versions, séances, invitations, réponses, corrigés et partages. Nécessite confirm=true. Fonctionne aussi sur un PRC archivé.
      parameters:
        - in: path
          name: prcId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeletePrcInput" }
      responses:
        "200":
          description: PRC et activités supprimés définitivement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletePrcResult" }
        "400":
          description: Confirmation manquante
        "401":
          description: Connexion enseignante requise
        "404":
          description: PRC introuvable ou accès propriétaire absent
  /prcs/{prcId}/collaborators:
    get:
      operationId: getPrcSharing
      tags: [prcs]
      description: Liste des collaborateurs du même PRC ; accessible uniquement aux professeurs autorisés pour ce cas.
      parameters:
        - in: path
          name: prcId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Propriétaire et collaborateurs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrcSharing" }
    post:
      operationId: sharePrc
      tags: [prcs]
      description: Ajoute ou modifie l’accès d’un compte PRC existant. Réservé au propriétaire ; aucune duplication du cas. La gestion des séances est facultative et désactivée par défaut.
      parameters:
        - in: path
          name: prcId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrcSharingInput" }
      responses:
        "200":
          description: Accès enregistré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collaborator" }
  /prcs/{prcId}/collaborators/{userId}:
    delete:
      operationId: removePrcCollaborator
      tags: [prcs]
      description: Retire l’accès au cas et à ses séances. Réservé au propriétaire ; conserve le contenu, les réponses et les versions.
      parameters:
        - in: path
          name: prcId
          required: true
          schema: { type: string }
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Accès retiré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollaborationRemoved" }
  /prcs/{prcId}/demo-session:
    post:
      operationId: openDemoStudentSession
      tags: [prcs]
      description: Le professeur ouvre ou retrouve une séance étudiante de démonstration pour la version actuelle, avec un code distinct par modalité. Une séance asynchrone nécessite son choix explicite. Ne modifie pas les anciennes copies illustratives.
      parameters:
        - in: path
          name: prcId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoSessionInput" }
      responses:
        "200":
          description: Séance ouverte, prête à accueillir des étudiants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Launch" }
        "401":
          description: Connexion enseignante requise
        "404":
          description: PRC introuvable ou gestion des séances non autorisée
        "409":
          description: PRC archivé, hors démonstration ou corrigé non validé pour cette version
  /teaching-sessions:
    get:
      operationId: listTeachingSessions
      tags: [activities]
      parameters:
        - { in: query, name: archived, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Séances gérées par le professeur
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TeachingSessionSummary" } }
    post:
      operationId: createTeachingSession
      tags: [activities]
      description: Crée atomiquement les activités des cas dans l’ordre choisi, avec des versions et barèmes figés. Un seul code et une identité par participant pour toute la séance synchrone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeachingSessionInput" }
      responses:
        "201":
          description: Séance créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeachingSessionCreated" }
  /teaching-sessions/options:
    get:
      operationId: listTeachingSessionOptions
      tags: [activities]
      responses:
        "200":
          description: Cas accessibles et disponibilité de leur corrigé
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TeachingCaseOption" } }
  /teaching-sessions/{sessionId}:
    get:
      operationId: getTeachingSession
      tags: [activities]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Pilotage de séance et suivi nominatif privé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeachingSessionDetail" }
  /teaching-sessions/{sessionId}/join:
    post:
      operationId: joinTeachingSession
      tags: [participants]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeachingSessionJoinInput" }
      responses:
        "200":
          description: Cookie de participation valable pour tous les cas
          content:
            application/json:
              schema: { type: object, properties: { csrfToken: { type: string } } }
  /teaching-sessions/{sessionId}/next:
    post:
      operationId: advanceTeachingSession
      tags: [activities]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeachingAdvanceInput" }
      responses:
        "200":
          description: Cas suivant ou bilan final activé
          content:
            application/json:
              schema: { type: object, properties: { advanced: { type: boolean }, finished: { type: boolean } } }
        "409":
          $ref: "#/components/responses/Error"
  /teaching-sessions/{sessionId}/projection:
    get:
      operationId: getTeachingProjection
      tags: [activities]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Vue collective sans identité ni résultats individuels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeachingSessionDetail" }
  /teaching-sessions/{sessionId}/archive:
    post:
      operationId: archiveTeachingSession
      tags: [activities]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeachingArchiveInput" }
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Séance terminée archivée, bilans conservés
  /teaching-sessions/{sessionId}/asynchronous:
    post:
      operationId: reuseTeachingSessionAsynchronously
      tags: [activities]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      responses:
        "201":
          description: Nouvelle participation asynchrone aux mêmes cas et barèmes figés sans duplication des PRC ni des réponses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeachingSessionCreated" }
  /teaching-sessions/{sessionId}/mode:
    post:
      operationId: setTeachingSessionMode
      tags: [activities]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeachingModeInput" }
      responses:
        "200": { description: Mode mis à jour avant le début de la séance }
        "409": { $ref: "#/components/responses/Error" }
  /teaching-sessions/{sessionId}/finish:
    post:
      operationId: finishAsyncTeachingSession
      tags: [activities]
      parameters:
        - { in: path, name: sessionId, required: true, schema: { type: string } }
      responses:
        "200": { description: Réponses fermées et distribution anonyme publiée }
  /participant/teaching-session/cases/{position}/results:
    get:
      operationId: getOwnTeachingCaseReview
      tags: [participants]
      parameters:
        - { in: path, name: position, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: Sa copie et le corrigé disponible de ce cas figé, en lecture seule et sans changer sa progression
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantResults" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /participant/teaching-session/next:
    post:
      operationId: advanceOwnTeachingSession
      tags: [participants]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeachingMemberAdvanceInput" }
      responses:
        "200": { description: "Après soumission, seul ce participant passe au cas suivant ou à son bilan" }
        "409": { $ref: "#/components/responses/Error" }
  /participant/teaching-session:
    get:
      operationId: getParticipantTeachingSession
      tags: [participants]
      responses:
        "200":
          description: Progression de sa séance et bilan personnel en fin de séance, sans copies d’autrui
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeachingMemberContext" }
  /prcs/{prcId}/launches:
    post:
      operationId: createLaunch
      tags: [activities]
      parameters:
        - in: path
          name: prcId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchInput"
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Launch"
  /launches/{launchId}:
    get:
      operationId: getLaunch
      tags: [activities]
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Activity control surface
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchDetail"
  /launches/{launchId}/session:
    post:
      operationId: advanceLiveSession
      tags: [activities]
      description: Le professeur présente le cas puis ouvre les réponses d’une nouvelle séance synchrone. Les transitions sont persistées, monotones et protégées côté serveur. Le chronomètre est indicatif ; la fermeture reste manuelle.
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionActionInput" }
      responses:
        "200":
          description: Étape de séance enregistrée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Launch" }
        "409":
          $ref: "#/components/responses/Error"
  /launches/{launchId}/discussion:
    post:
      operationId: advanceDiscussion
      description: Révèle la comparaison puis un corrigé par diagnostic. Réservé au propriétaire d’une séance synchrone fermée. Les étapes concurrentes sont sérialisées et les corrigés révélés sont conservés.
      tags: [launches]
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscussionInput"
      responses:
        "200":
          description: Étape enregistrée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Launch" }
  /launches/{launchId}/invitations:
    post:
      operationId: createInvitation
      tags: [activities]
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Individual expert invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
  /join/{code}:
    get:
      operationId: getJoinInfo
      security: []
      tags: [participants]
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public activity details without answers or reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinInfo"
  /launches/{launchId}/join:
    post:
      operationId: joinLaunch
      security: []
      description: >-
        Crée ou reprend une participation sans compte enseignant. Un panel exige
        le code de séance ou une invitation individuelle valide. Un joinKey UUIDv4 aléatoire permet
        la reprise d’une participation et rend une nouvelle tentative de jonction
        idempotente. Ce jeton est un secret de reprise, jamais un pseudonyme.
      tags: [participants]
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinInput"
      responses:
        "200":
          description: Participant session and immutable case snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantSession"
  /participant/response:
    get:
      operationId: getParticipantResponse
      security:
        - participantSession: []
      tags: [participants]
      responses:
        "200":
          description: Saved draft response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantState"
    put:
      operationId: saveParticipantResponse
      description: >-
        Sauvegarde optimiste du brouillon. Envoyer la revision reçue lors du
        dernier GET ou PUT. Son omission reste acceptée uniquement à la révision
        initiale zéro. Une copie plus récente ou déjà soumise provoque HTTP 409
        et doit être relue ; une sauvegarde ancienne ne l’écrase pas.
      security:
        - participantSession: []
      tags: [participants]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantResponseInput"
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantState"
  /participant/submit:
    post:
      operationId: submitParticipantResponse
      description: >-
        Verrouille la copie et calcule son score une seule fois sur la référence
        figée. Une nouvelle tentative d’une soumission déjà enregistrée renvoie
        la même copie avec HTTP 200, y compris après fermeture. Une première
        soumission qui perd la course avec la fermeture est refusée avec HTTP 409.
        Envoyer expectedRevision pour confirmer exactement la version relue ; une
        autre révision persistée provoque HTTP 409 sans verrouiller la copie.
      security:
        - participantSession: []
      tags: [participants]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionInput" }
      responses:
        "409":
          $ref: "#/components/responses/Error"
        "200":
          description: Final locked submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /launches/{launchId}/close:
    post:
      operationId: closeLaunch
      tags: [activities]
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Collection closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Launch"
  /launches/{launchId}/reveal:
    post:
      operationId: revealLaunch
      tags: [activities]
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealInput"
      responses:
        "200":
          description: Activity reveal state updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Launch"
  /launches/{launchId}/panel-results:
    get:
      operationId: getPanelResults
      tags: [activities]
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Expert response distributions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelResults"
  /launches/{launchId}/reference/generate:
    post:
      operationId: generateReference
      tags: [activities]
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceGenerateInput"
      responses:
        "200":
          description: Immutable reference preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reference"
  /launches/{launchId}/reference/rubric:
    put:
      operationId: updateProfessorRubric
      tags: [launches]
      description: Modifie le barème proposé aux prochains groupes, même après validation clinique. Les groupes déjà ouverts conservent leur copie figée. Contrôle de version obligatoire.
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RubricUpdateInput" }
      responses:
        "200":
          description: Barème enregistré pour les prochains groupes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reference" }
        "400":
          description: Barème invalide
        "409":
          description: Version obsolète ou corrigé non disponible
  /launches/{launchId}/reference/validate:
    post:
      operationId: validateReference
      tags: [activities]
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceValidateInput"
      responses:
        "200":
          description: Validated immutable reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reference"
  /launches/{launchId}/publish:
    post:
      operationId: publishResults
      tags: [activities]
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Individual results published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Launch"
  /launches/{launchId}/results:
    get:
      operationId: getLaunchResults
      tags: [activities]
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Teacher view of participants and scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchResults"
  /participant/results:
    get:
      operationId: getParticipantResults
      description: >-
        Renvoie uniquement sa copie. Pour un expert ayant soumis, expertPanel
        contient immédiatement les agrégats anonymes du panel, même pendant la collecte.
        studentReview suit les étapes révélées en synchrone, avec des sous-totaux personnels
        uniquement pour les diagnostics corrigés ; la note globale attend la publication.
        En asynchrone, la copie soumise reçoit immédiatement ses deux corrections et sa note,
        sans résultats des autres étudiants. Un brouillon reste non soumis, sans note ;
        les experts ne sont jamais notés. Les anciens groupes conservent leurs étapes historiques.
      security:
        - participantSession: []
      tags: [participants]
      responses:
        "200":
          description: Own score and visible panel data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantResults"
  /demo-case:
    get:
      operationId: getDemoCase
      tags: [demonstrations]
      security: []
      summary: Cas public fictif Toux, sans réponses ni corrigé
      responses:
        "200":
          description: Vingt observations pour un essai local sans création de copie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoCase" }
  /demo:
    post:
      operationId: ensureDemo
      tags: [demonstrations]
      description: >-
        Prépare une démonstration isolée pour l’enseignant connecté. Chaque appel
        effectue au maximum quatre nouvelles copies ou environ dix secondes de
        travail. Répéter tant que pending est true ; les appels suivants reprennent
        les mêmes identifiants et copies. Une préparation concurrente active
        renvoie HTTP 409. Les scores sont produits par le moteur ordinaire.
      responses:
        "200":
          description: Progression persistée ou démonstration terminée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSetupResult" }
        "409":
          $ref: "#/components/responses/Error"
  /prcs/{prcId}/duplicate:
    post:
      operationId: duplicatePrc
      tags: [prcs]
      description: Copie le contenu clinique dans un nouveau PRC du propriétaire, sans copies ni références historiques.
      parameters:
        - in: path
          name: prcId
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Nouveau brouillon indépendant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicatePrcResult" }
  /prcs/{prcId}/trial:
    post:
      operationId: createTrial
      tags: [activities]
      description: >-
        Crée un lancement panel d’essai et une invitation individuelle permettant
        au professeur de suivre le vrai parcours participant. Les copies d’essai
        ne peuvent pas générer une référence réelle.
      parameters:
        - in: path
          name: prcId
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Accès au lancement d’essai isolé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrialResult" }
  /participant/state:
    get:
      operationId: getParticipantActivityState
      tags: [participants]
      security:
        - participantSession: []
      description: État de sa propre séance, sans copie d’autrui. Pour les séances pilotées, inclut le cas lorsque le professeur l’a présenté, l’étape courante et le nombre de personnes ayant rejoint.
      responses:
        "200":
          description: État persistant du lancement et de sa propre copie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParticipantActivityState" }
  /launches/{launchId}/projection:
    get:
      operationId: getLaunchProjection
      tags: [activities]
      description: >-
        Vue authentifiée du propriétaire, filtrée par les étapes de révélation.
        Ne contient ni identités de participants ni scores individuels.
      parameters:
        - in: path
          name: launchId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cas et agrégats anonymes pour la projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Projection" }
components:
  securitySchemes:
    teacherSession:
      type: apiKey
      in: cookie
      name: prc_session
      description: Session opaque enseignante HttpOnly, Secure en production.
    participantSession:
      type: apiKey
      in: cookie
      name: prc_participant_session
      description: Session opaque participante, sans privilèges enseignants.
  responses:
    Error:
      description: Erreur JSON de validation, d’autorisation, de conflit ou de service indisponible
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    HealthStatus:
      type: object
      properties: { status: { type: string } }
      required: [status]
    Ok:
      type: object
      properties: { ok: { type: boolean } }
      required: [ok]
    CurrentUser:
      type: object
      properties:
        user: { $ref: "#/components/schemas/Teacher" }
        csrfToken: { type: ["string", "null"] }
      required: [user, csrfToken]
    Teacher:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, teacher] }
        active: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, username, role, active, mustChangePassword, createdAt]
    TeacherInput:
      type: object
      properties:
        username: { type: string, minLength: 3, maxLength: 80 }
        password: { type: string, minLength: 12, maxLength: 200 }
      required: [username, password]
    TeacherUpdate:
      type: object
      properties:
        active: { type: boolean }
        password: { type: string, minLength: 12, maxLength: 200 }
    LoginInput:
      type: object
      properties:
        username: { type: string, minLength: 1, maxLength: 80 }
        password: { type: string, minLength: 1, maxLength: 200 }
      required: [username, password]
    PasswordChangeInput:
      type: object
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 12, maxLength: 200 }
      required: [currentPassword, newPassword]
    Prc:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        scenario: { type: string }
        status: { type: string }
        version: { type: integer }
        updatedAt: { type: string, format: date-time }
        launchCount: { type: integer }
        archived: { type: boolean }
        isDemo: { type: boolean }
        ownerUsername: { type: string }
        shared: { type: boolean }
        permissions:
          type: object
          properties:
            edit: { type: boolean }
            share: { type: boolean }
            archive: { type: boolean }
            delete: { type: boolean }
            manageSessions: { type: boolean }
        workflow: { $ref: "#/components/schemas/PrcWorkflow" }
      required: [id, name, scenario, status, version, updatedAt, launchCount]
    PrcDetail:
      allOf:
        - $ref: "#/components/schemas/Prc"
        - type: object
          properties:
            instructions: { type: string }
            diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
            observations: { type: array, items: { $ref: "#/components/schemas/Observation" } }
            launches: { type: array, items: { $ref: "#/components/schemas/Launch" } }
          required: [instructions, diagnostics, observations]
    PrcInput:
      type: object
      properties:
        version: { type: integer, minimum: 1, description: Version lue lors de l’ouverture du formulaire. Requise pour un PRC partagé ; HTTP 409 si une autre version a été enregistrée. }
        name: { type: string, maxLength: 160 }
        scenario: { type: string, maxLength: 20000 }
        instructions: { type: string, maxLength: 5000 }
        diagnostics:
          type: array
          items: { type: string, maxLength: 240 }
        observations:
          type: array
          items: { $ref: "#/components/schemas/ObservationInput" }
      required: [name, scenario, instructions, diagnostics, observations]
    Diagnostic:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
      required: [id, label]
    Observation:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        category: { type: string }
        position: { type: integer }
      required: [id, text, category, position]
    ObservationInput:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        category: { type: string }
        position: { type: integer }
      required: [id, text, category, position]
    TeachingSessionInput:
      type: object
      properties:
        deliveryMode: { type: string, enum: [synchronous, asynchronous], default: synchronous, description: Choix du professeur. Le mode peut être changé avant le début et avant toute inscription. }
        name: { type: string, minLength: 1, maxLength: 160 }
        role: { type: string, enum: [panel, students] }
        prcIds: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string } }
      required: [name, role, prcIds]
    TeachingSessionJoinInput:
      type: object
      properties:
        pseudonym: { type: string, minLength: 1, maxLength: 100 }
        code: { type: string }
        joinKey: { type: string, format: uuid, description: Clé de reprise aléatoire ; le nom seul ne permet pas de retrouver une copie. }
      required: [pseudonym, code, joinKey]
    TeachingModeInput:
      type: object
      properties:
        deliveryMode: { type: string, enum: [synchronous, asynchronous] }
      required: [deliveryMode]
    TeachingMemberAdvanceInput:
      type: object
      properties:
        launchId: { type: string }
        expectedPosition: { type: integer, minimum: 0 }
      required: [launchId, expectedPosition]
    TeachingArchiveInput:
      type: object
      properties:
        archived: { type: boolean, default: true }
    TeachingAdvanceInput:
      type: object
      properties:
        skipUnanswered: { type: boolean, description: Exclut explicitement un cas fermé sans soumission de la note globale et de son maximum. }
        expectedPosition: { type: integer, minimum: 0 }
      required: [expectedPosition]
    TeachingSessionCreated:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
      required: [id, code]
    TeachingCaseOption:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        ready: { type: boolean }
        corrected: { type: boolean }
      required: [id, name, version, ready, corrected]
    TeachingSessionSummary:
      type: object
      properties:
        deliveryMode: { type: string, enum: [synchronous, asynchronous] }
        archivedAt: { type: [string, "null"], format: date-time }
        id: { type: string }
        name: { type: string }
        code: { type: string }
        role: { type: string, enum: [panel, students] }
        status: { type: string, enum: [open, finished] }
        currentPosition: { type: integer }
        caseCount: { type: integer }
        memberCount: { type: integer }
      required: [id, name, code, role, status]
    TeachingCase:
      type: object
      properties:
        skipped: { type: boolean }
        id: { type: string }
        name: { type: string }
        position: { type: integer }
        status: { type: string }
        maximum: { type: number }
      required: [id, name, position, status, maximum]
    TeachingSessionDetail:
      allOf:
        - $ref: "#/components/schemas/TeachingSessionSummary"
        - type: object
          properties:
            cases: { type: array, items: { $ref: "#/components/schemas/TeachingCase" } }
            report: { type: object, additionalProperties: true, description: Le suivi nominatif est réservé au professeur ; la projection ne contient ni membres ni notes individuelles. }
          required: [cases, report]
    TeachingMemberContext:
      type: object
      properties:
        session:
          type: [object, "null"]
          properties:
            id: { type: string }
            name: { type: string }
            status: { type: string, enum: [open, finished] }
            role: { type: string, enum: [panel, students] }
            position: { type: integer }
            total: { type: integer }
            currentLaunchId: { type: string }
            deliveryMode: { type: string, enum: [synchronous, asynchronous] }
            currentSubmitted: { type: boolean }
            groupFinished: { type: boolean }
        report: { type: object, additionalProperties: true, description: Seulement son bilan personnel et les statistiques anonymes, disponible à la fin. Les participations incomplètes ne reçoivent pas de note globale. }
      required: [session]
    TeachingCaseContext:
      type: object
      properties:
        code: { type: string, description: Code commun de la séance. }
        id: { type: string }
        name: { type: string }
        position: { type: integer }
        total: { type: integer }
      required: [id, name, position, total]
    SessionActionInput:
      type: object
      properties:
        action: { type: string, enum: [present, open] }
        durationMinutes: { type: [integer, "null"], minimum: 1, maximum: 180 }
      required: [action]
    LiveSession:
      type: object
      properties:
        phase: { type: string, enum: [lobby, case, answering] }
        openedAt: { type: string, format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
      required: [phase]
    Launch:
      type: object
      properties:
        teachingSession: { $ref: "#/components/schemas/TeachingCaseContext" }
        id: { type: string }
        prcId: { type: string }
        role: { type: string, enum: [panel, students] }
        name: { type: string, description: Nom du PRC figé lors du lancement. }
        prcName: { type: string }
        caseVersion: { type: integer }
        isTrial: { type: boolean }
        guidedReview: { type: boolean }
        scoringVersion: { type: string, description: Barème figé à la création du groupe. custom-rubric-v1 utilise le modèle personnalisé du professeur ; les versions antérieures restent conservées. }
        grading: { $ref: "#/components/schemas/GradingSummary" }
        deliveryMode: { type: string, enum: [synchronous, asynchronous] }
        code: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        participantCount: { type: integer }
        submissionCount: { type: integer }
        liveSession: { $ref: "#/components/schemas/LiveSession" }
        serverNow: { type: string, format: date-time }
      required: [id, prcId, role, name, code, status, createdAt, participantCount, submissionCount]
    LaunchDetail:
      allOf:
        - $ref: "#/components/schemas/Launch"
        - type: object
          properties:
            reveals: { $ref: "#/components/schemas/RevealState" }
            referenceStatus: { type: ["string", "null"] }
            reference:
              anyOf:
                - $ref: "#/components/schemas/Reference"
                - type: "null"
            case: { $ref: "#/components/schemas/CaseSnapshot" }
          required: [reveals, referenceStatus]
    LaunchInput:
      type: object
      properties:
        role: { type: string, enum: [panel, students] }
        name: { type: string, maxLength: 160, deprecated: true, description: Compatibilité historique ; le serveur utilise le nom du PRC. }
        isTrial: { type: boolean, default: false }
        sessionMode: { type: string, enum: [synchronous, asynchronous], description: synchronous ajoute une salle d’attente et l’ouverture explicite des réponses. Les anciens lancements sans cette propriété conservent leur fonctionnement. }
        deliveryMode: { type: string, enum: [synchronous, asynchronous], description: Active le parcours étudiant guidé ou la correction immédiate. Sans cette propriété, conserve le fonctionnement historique des anciens clients. }
      required: [role]
    InvitationInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
      required: [name]
    Invitation:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        code: { type: string }
      required: [id, name, url, code]
    JoinInfo:
      allOf:
        - $ref: "#/components/schemas/CaseSnapshot"
        - type: object
          properties:
            launchId: { type: string }
            role: { type: string }
            status: { type: string }
            isTrial: { type: boolean }
            liveSession: { $ref: "#/components/schemas/LiveSession" }
            guidedReview: { type: boolean }
            scoringVersion: { type: string }
            grading: { $ref: "#/components/schemas/GradingSummary" }
            deliveryMode: { type: string, enum: [synchronous, asynchronous] }
            requiredChoices: { type: [integer, "null"], minimum: 1, maximum: 5 }
          required: [launchId, role, status]
    JoinInput:
      type: object
      properties:
        pseudonym: { type: string, minLength: 1, maxLength: 100 }
        invitationToken: { type: string, description: Invitation individuelle facultative pour rejoindre ou reprendre un panel. }
        code: { type: string, maxLength: 100, description: Code de séance requis pour rejoindre un panel sans invitation individuelle. }
        joinKey:
          type: string
          format: uuid
          description: UUIDv4 aléatoire conservé localement pour reprendre sa participation ; ne pas publier ni journaliser.
      required: [pseudonym]
    ParticipantSession:
      type: object
      properties:
        participantId: { type: string }
        csrfToken: { type: string }
        response: { $ref: "#/components/schemas/ParticipantResponse" }
        joinInfo: { $ref: "#/components/schemas/JoinInfo" }
      required: [participantId, csrfToken, response, joinInfo]
    ParticipantResponse:
      type: object
      properties:
        state: { type: string }
        mainDiagnosticId: { type: ["string", "null"] }
        alternativeDiagnosticId: { type: ["string", "null"] }
        mainChoices: { type: array, items: { $ref: "#/components/schemas/Choice" } }
        alternativeChoices: { type: array, items: { $ref: "#/components/schemas/Choice" } }
        updatedAt: { type: ["string", "null"], format: date-time }
        revision: { type: integer, minimum: 0, description: Version persistée de la copie à renvoyer lors de la sauvegarde suivante. }
      required: [state, mainDiagnosticId, alternativeDiagnosticId, mainChoices, alternativeChoices, updatedAt]
    ParticipantState:
      type: object
      properties:
        response: { $ref: "#/components/schemas/ParticipantResponse" }
        joinInfo: { $ref: "#/components/schemas/JoinInfo" }
        csrfToken: { type: string }
      required: [response, joinInfo, csrfToken]
    ParticipantResponseInput:
      type: object
      properties:
        launchId: { type: string, description: Requis pour une séance à plusieurs cas ; refuse les sauvegardes provenant d’un ancien cas. }
        mainDiagnosticId: { type: ["string", "null"] }
        alternativeDiagnosticId: { type: ["string", "null"] }
        mainChoices: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/Choice" } }
        alternativeChoices: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/Choice" } }
        revision: { type: integer, minimum: 0, description: Révision lue précédemment ; nécessaire dès que la révision persistée dépasse zéro. }
        expectedRevision: { type: integer, minimum: 0, description: Alias de revision ; revision est prioritaire si les deux sont présents. }
      required: [mainDiagnosticId, alternativeDiagnosticId, mainChoices, alternativeChoices]
    Choice:
      type: object
      properties:
        observationId: { type: string }
        sign: { type: string, enum: ["+", "-"] }
        points: { type: integer, minimum: 1, maximum: 3, description: Pouvoir discriminant attribué par l’expert ; requis à la soumission experte et absent des choix étudiants. }
      required: [observationId, sign]
    Submission:
      allOf:
        - $ref: "#/components/schemas/ParticipantResponse"
        - type: object
          properties:
            submittedAt: { type: string, format: date-time }
          required: [submittedAt]
    RevealState:
      type: object
      properties:
        mainDiagnostic: { type: boolean }
        liveSession: { $ref: "#/components/schemas/LiveSession" }
        mainArguments: { type: boolean }
        alternativeDiagnostic: { type: boolean }
        alternativeArguments: { type: boolean }
        reference: { type: boolean }
        diagnosticComparison: { type: boolean }
        correctedDiagnosticIds: { type: array, items: { type: string } }
        activeDiagnosticId: { type: string }
        mainDiagnosticTopOnly: { type: boolean, description: Affiche uniquement les principales les plus fréquentes en conservant les égalités. }
      required: [mainDiagnostic, mainArguments, alternativeDiagnostic, alternativeArguments, reference]
    RevealInput:
      type: object
      properties:
        mainDiagnostic: { type: boolean }
        mainArguments: { type: boolean }
        alternativeDiagnostic: { type: boolean }
        alternativeArguments: { type: boolean }
        reference: { type: boolean }
        mainDiagnosticTopOnly: { type: boolean, description: Affiche uniquement les principales les plus fréquentes en conservant les égalités. }
    PanelResults:
      type: object
      properties:
        totalSubmissions: { type: integer }
        minimumPanelSize: { type: integer }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/DiagnosticCount" } }
        distributions: { type: array, items: { $ref: "#/components/schemas/DiagnosticDistribution" } }
      required: [totalSubmissions, minimumPanelSize, diagnostics, distributions]
    ReferenceGenerateInput:
      type: object
      properties:
        minimumPanelSize: { type: integer, minimum: 1, maximum: 100 }
      required: [minimumPanelSize]
    ReferenceValidateInput:
      type: object
      properties:
        explanation: { type: string, maxLength: 5000 }
      required: [explanation]
    Reference:
      type: object
      properties:
        status: { type: string }
        minimumPanelSize: { type: integer }
        panelSize: { type: integer }
        explanation: { type: string }
        scoring: { $ref: "#/components/schemas/ScoringRule" }
        rubric: { $ref: "#/components/schemas/ProfessorRubric" }
        suggestedRubric: { $ref: "#/components/schemas/ProfessorRubric" }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/DiagnosticCount" } }
        distributions: { type: array, items: { $ref: "#/components/schemas/DiagnosticDistribution" } }
      required: [status, minimumPanelSize, panelSize, explanation, scoring, diagnostics, distributions]
    WorkspaceSummary:
      type: object
      properties:
        prcCount: { type: integer }
        activeLaunchCount: { type: integer }
        participantCount: { type: integer }
        submissionCount: { type: integer }
        activeLaunches:
          type: array
          items: { $ref: "#/components/schemas/Launch" }
        recentLaunches:
          type: array
          items: { $ref: "#/components/schemas/Launch" }
      required: [prcCount, activeLaunchCount, participantCount, submissionCount, recentLaunches]
    LaunchResults:
      type: object
      properties:
        launch: { $ref: "#/components/schemas/Launch" }
        participants: { type: array, items: { $ref: "#/components/schemas/LaunchParticipantResult" } }
        submittedCount: { type: integer }
        participantCount: { type: integer }
        case: { $ref: "#/components/schemas/CaseSnapshot" }
        reveals: { $ref: "#/components/schemas/RevealState" }
        class: { $ref: "#/components/schemas/VisibleAggregate" }
        panel: { $ref: "#/components/schemas/VisibleAggregate" }
        discussion: { $ref: "#/components/schemas/StudentReview" }
        gradeDistribution: { $ref: "#/components/schemas/GradeDistribution" }
      required: [launch, participants, submittedCount, participantCount]
    ParticipantResults:
      type: object
      properties:
        published: { type: boolean }
        guidedReview: { type: boolean }
        deliveryMode: { type: string, enum: [synchronous, asynchronous] }
        studentReview: { $ref: "#/components/schemas/StudentReview" }
        gradeDistribution: { $ref: "#/components/schemas/GradeDistribution", description: Bilan anonyme du groupe uniquement après publication finale par le professeur. }
        case: { $ref: "#/components/schemas/JoinInfo" }
        response: { $ref: "#/components/schemas/ParticipantResponse" }
        score: { type: ["number", "null"], minimum: 0, maximum: 100, description: Note selon le barème figé de la séance, dont le maximum figure dans case.grading ; null pour les experts, avant publication et pour une copie non soumise. }
        percentage: { type: ["number", "null"], minimum: 0, maximum: 100 }
        components: { $ref: "#/components/schemas/VisibleScoreComponents" }
        role: { type: string, enum: [panel, students] }
        status: { type: string }
        reveals: { $ref: "#/components/schemas/RevealState" }
        panel: { $ref: "#/components/schemas/VisibleAggregate" }
        expertPanel:
          allOf:
            - $ref: "#/components/schemas/VisibleAggregate"
          description: Agrégats anonymes des réponses définitives du panel, vous compris ; accessibles uniquement à un expert ayant soumis sa copie, même pendant la collecte.
        class: { $ref: "#/components/schemas/VisibleAggregate" }
        reference:
          anyOf:
            - $ref: "#/components/schemas/VisibleReference"
            - type: "null"
      required: [published, case, response, score, components, panel]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    CaseSnapshot:
      type: object
      properties:
        teachingSession: { $ref: "#/components/schemas/TeachingCaseContext" }
        teachingSessionId: { type: string, description: Présent lors de la résolution du code commun de séance. }
        canResume: { type: boolean, description: Le cookie courant permet de reprendre une participation existante à la séance. }
        name: { type: string }
        scenario: { type: string }
        instructions: { type: string }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/Diagnostic" } }
        observations: { type: array, items: { $ref: "#/components/schemas/Observation" } }
      required: [name, scenario, instructions, diagnostics, observations]
    PrcWorkflow:
      type: object
      properties:
        rubricRevision: { type: integer }
        step: { type: string, enum: [prepare, panel, reference, students] }
        missing: { type: array, items: { type: string } }
        panelLaunchId: { type: ["string", "null"] }
        referenceStatus: { type: ["string", "null"] }
      required: [step, missing, panelLaunchId, referenceStatus]
    DemoSessionInput:
      type: object
      properties:
        sessionMode: { type: string, enum: [synchronous, asynchronous] }
        deliveryMode:
          type: string
          enum: [synchronous, asynchronous]
          description: Choix explicite du professeur, enregistré dans la séance et non modifiable par les étudiants.
      required: [deliveryMode]
    DeletePrcInput:
      type: object
      properties:
        confirm: { type: boolean, enum: [true] }
      required: [confirm]
    DeletePrcResult:
      type: object
      properties:
        id: { type: string }
        deleted: { type: boolean, enum: [true] }
      required: [id, deleted]
    ArchiveInput:
      type: object
      properties:
        archived: { type: boolean }
      required: [archived]
    ArchiveResult:
      allOf:
        - $ref: "#/components/schemas/ArchiveInput"
        - type: object
          properties:
            id: { type: string }
          required: [id]
    DuplicatePrcResult:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: integer }
        archived: { type: boolean }
        isDemo: { type: boolean }
      required: [id, name, version, archived, isDemo]
    TrialResult:
      type: object
      properties:
        launch: { $ref: "#/components/schemas/Launch" }
        code: { type: string }
        invitationUrl: { type: string, description: Lien individuel secret à ouvrir dans une session participante distincte. }
      required: [launch, code, invitationUrl]
    ParticipantActivityState:
      type: object
      properties:
        liveSession: { $ref: "#/components/schemas/LiveSession" }
        joinInfo: { $ref: "#/components/schemas/JoinInfo" }
        participantCount: { type: integer }
        serverNow: { type: string, format: date-time }
        status: { type: string }
        role: { type: string, enum: [panel, students] }
        reveals: { $ref: "#/components/schemas/RevealState" }
        published: { type: boolean }
        guidedReview: { type: boolean }
        deliveryMode: { type: string, enum: [synchronous, asynchronous] }
        responseState: { type: string }
        revision: { type: integer, minimum: 0 }
        updatedAt: { type: ["string", "null"], format: date-time }
      required: [status, role, reveals, published, responseState, revision, updatedAt]
    DiagnosticCount:
      type: object
      additionalProperties: true
      properties:
        diagnosticId: { type: string }
        label: { type: string }
        mainCount: { type: integer, minimum: 0 }
        mainPercent: { type: number, minimum: 0, maximum: 100 }
        alternativeCount: { type: integer, minimum: 0 }
        alternativePercent: { type: number, minimum: 0, maximum: 100 }
      required: [diagnosticId, label]
    ObservationDistribution:
      type: object
      properties:
        observationId: { type: string }
        label: { type: string }
        category: { type: string }
        positive: { type: integer, minimum: 0 }
        negative: { type: integer, minimum: 0 }
        positivePoints: { type: integer, minimum: 0, description: Somme des points experts pour le signe positif. }
        negativePoints: { type: integer, minimum: 0, description: Somme des points experts pour le signe négatif. }
        notSelected: { type: integer, minimum: 0 }
        positivePercent: { type: number }
        negativePercent: { type: number }
        notSelectedPercent: { type: number }
      required: [observationId, positive, negative, notSelected]
    DiagnosticDistribution:
      type: object
      additionalProperties: true
      properties:
        diagnosticId: { type: string }
        role: { type: string, enum: [main, alternative] }
        expertCount: { type: integer, minimum: 0, description: Dénominateur propre au diagnostic et au rôle ; effectif de classe dans un agrégat classe. }
        observations: { type: array, items: { $ref: "#/components/schemas/ObservationDistribution" } }
        ceiling: { type: number, minimum: 0 }
      required: [diagnosticId, role, expertCount, observations, ceiling]
    ScoringRule:
      type: object
      additionalProperties: true
      properties:
        version: { type: string }
        mainDiagnosis: { type: number }
        mainJustification: { type: number }
        alternativeDiagnosis: { type: number }
        alternativeJustification: { type: number }
        total: { type: number }
        description: { type: string }
    ScoreComponent:
      type: object
      properties:
        diagnosis: { type: number }
        justification: { type: number }
        represented: { type: boolean }
        raw: { type: number }
        ceiling: { type: number }
      required: [diagnosis, justification, represented, raw, ceiling]
    VisibleScoreComponents:
      type: object
      description: Vide tant que la note privée n’est pas publiée ou si la copie est non soumise.
      additionalProperties: true
      properties:
        mainDiagnosis: { type: number }
        mainJustification: { type: number }
        alternativeDiagnosis: { type: number }
        alternativeJustification: { type: number }
        total: { type: number, description: Note sur 20. }
        percentage: { type: number, description: Pourcentage sur 100. }
        main: { $ref: "#/components/schemas/ScoreComponent" }
        alternative: { $ref: "#/components/schemas/ScoreComponent" }
    VisibleReference:
      type: object
      properties:
        explanation: { type: string }
        scoring: { $ref: "#/components/schemas/ScoringRule" }
      required: [explanation, scoring]
    VisibleAggregate:
      type: object
      description: Agrégat anonyme. Pour la projection et les étudiants, les champs non révélés sont absents et l’objet est vide pendant la collecte. expertPanel est accessible après soumission experte.
      additionalProperties: true
      properties:
        totalSubmissions: { type: integer }
        minimumPanelSize: { type: integer }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/DiagnosticCount" } }
        distributions: { type: array, items: { $ref: "#/components/schemas/DiagnosticDistribution" } }
        referenceVisible: { type: boolean }
        reference:
          anyOf:
            - $ref: "#/components/schemas/VisibleReference"
            - type: "null"
    LaunchParticipantResult:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        pseudonym: { type: string }
        role: { type: string }
        state: { type: string }
        submittedAt: { type: ["string", "null"], format: date-time }
        score: { type: ["number", "null"], description: Note selon le maximum du groupe, null si aucune note. }
        components:
          anyOf:
            - $ref: "#/components/schemas/VisibleScoreComponents"
            - type: "null"
      required: [id, pseudonym, role, state, submittedAt, score, components]
    Projection:
      type: object
      description: Agrégats anonymes sans identités ni notes individuelles.
      properties:
        launch:
          allOf:
            - $ref: "#/components/schemas/Launch"
            - type: object
              properties:
                reveals: { $ref: "#/components/schemas/RevealState" }
        case: { $ref: "#/components/schemas/CaseSnapshot" }
        discussion: { $ref: "#/components/schemas/StudentReview" }
        gradeDistribution: { $ref: "#/components/schemas/GradeDistribution" }
        role: { type: string }
        status: { type: string }
        reveals: { $ref: "#/components/schemas/RevealState" }
        panel: { $ref: "#/components/schemas/VisibleAggregate" }
        class: { $ref: "#/components/schemas/VisibleAggregate" }
        reference:
          anyOf:
            - $ref: "#/components/schemas/VisibleReference"
            - type: "null"
      required: [launch, case, role, status, reveals, panel, class, reference]
    DemoCase:
      allOf:
        - $ref: "#/components/schemas/CaseSnapshot"
        - type: object
          properties:
            demonstrationLabel: { type: string }
            observations:
              type: array
              minItems: 20
              maxItems: 20
              items: { $ref: "#/components/schemas/Observation" }
          required: [demonstrationLabel]
    DemoSetupResult:
      type: object
      properties:
        prcId: { type: string }
        panelLaunchId: { type: ["string", "null"] }
        studentLaunchId: { type: ["string", "null"] }
        demonstrationLabel: { type: string }
        pending: { type: boolean }
        progress:
          type: object
          properties:
            expertsSubmitted: { type: integer }
            totalExperts: { type: integer }
            studentsSubmitted: { type: integer }
            totalStudents: { type: integer }
          required: [expertsSubmitted, totalExperts, studentsSubmitted, totalStudents]
      required: [prcId, panelLaunchId, studentLaunchId, demonstrationLabel, pending, progress]
    LaunchResultsParticipantsItem:
      allOf:
        - $ref: "#/components/schemas/LaunchParticipantResult"
    PanelResultsDiagnosticsItem:
      allOf:
        - $ref: "#/components/schemas/DiagnosticCount"
    PanelResultsDistributionsItem:
      allOf:
        - $ref: "#/components/schemas/DiagnosticDistribution"
    ReferenceDiagnosticsItem:
      allOf:
        - $ref: "#/components/schemas/DiagnosticCount"
    ReferenceDistributionsItem:
      allOf:
        - $ref: "#/components/schemas/DiagnosticDistribution"
    ReferenceScoring:
      allOf:
        - $ref: "#/components/schemas/ScoringRule"
    ParticipantResultsComponents:
      allOf:
        - $ref: "#/components/schemas/VisibleScoreComponents"
    ParticipantResultsPanel:
      allOf:
        - $ref: "#/components/schemas/VisibleAggregate"
    SubmissionInput:
      type: object
      properties:
        launchId: { type: string, description: Requis dans une séance à plusieurs cas. }
        expectedRevision:
          type: integer
          minimum: 0
          description: Révision de la copie relue avant confirmation ; un conflit renvoie HTTP 409 sans soumettre.

    DiscussionInput:
      type: object
      properties:
        action: { type: string, enum: [comparison, diagnostic] }
        diagnosticId: { type: string }
      required: [action]
    StudentReview:
      type: object
      description: Restitution contrôlée par le serveur. En synchrone, seules les étapes révélées sont présentes ; en asynchrone, seules les deux impressions cliniques d’un étudiant ayant soumis sont corrigées, sans résultat des autres étudiants. La projection ne contient aucun champ personnel.
      properties:
        scoringVersion: { type: string }
        maximum: { type: number }
        grading: { $ref: "#/components/schemas/GradingSummary" }
        deliveryMode: { type: string, enum: [synchronous, asynchronous] }
        comparisonVisible: { type: boolean }
        comparison:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              diagnosticId: { type: string }
              label: { type: string }
              panelCount: { type: integer }
              panelTotal: { type: integer }
              panelPercent: { type: number }
              studentCount: { type: integer }
              studentTotal: { type: integer }
              studentPercent: { type: number }
        corrections:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              diagnosticId: { type: string }
              label: { type: string }
              panelCount: { type: integer }
              represented: { type: boolean }
              topDiagnosis: { type: boolean }
              selectedRole: { type: [string, "null"], enum: [main, alternative, null] }
              score: { type: [number, "null"] }
              diagnosisScore: { type: [number, "null"] }
              justificationScore: { type: [number, "null"] }
              raw: { type: [number, "null"] }
              maximum: { type: number }
              diagnosisMaximum: { type: number }
              clinicalMaximum: { type: number }
              zeroByRubric: { type: boolean }
              ceiling: { type: number }
              observations:
                type: array
                items:
                  type: object
                  additionalProperties: true
                  properties:
                    observationId: { type: string }
                    label: { type: string }
                    category: { type: string }
                    positive: { type: integer }
                    negative: { type: integer }
                    positivePoints: { type: integer }
                    negativePoints: { type: integer }
                    positiveScorePoints: { type: number }
                    negativeScorePoints: { type: number }
                    studentSign: { type: [string, "null"], enum: ["+", "-", null] }
                    earnedPoints: { type: number }
                    earnedScorePoints: { type: number }
                    referenceScorePoints: { type: number }
                    topClinical: { type: boolean }
                    bestSigns: { type: array, items: { type: string, enum: ["+", "-"] } }
        activeDiagnosticId: { type: [string, "null"] }
        explanation: { type: string }
      required: [deliveryMode, comparisonVisible, comparison, corrections]

    GradingSummary:
      type: object
      properties:
        maximum: { type: number }
        attainableMaximum: { type: number }
        mainDiagnosisMaximum: { type: number }
        alternativeDiagnosisMaximum: { type: number }
        clinicalMaximum: { type: number }
        rubricRevision: { type: integer }
      required: [maximum, attainableMaximum, mainDiagnosisMaximum, alternativeDiagnosisMaximum, clinicalMaximum]
    RubricObservation:
      type: object
      properties:
        observationId: { type: string }
        positivePoints: { type: number, minimum: 0, maximum: 100 }
        negativePoints: { type: number, minimum: 0, maximum: 100 }
      required: [observationId, positivePoints, negativePoints]
    RubricDiagnostic:
      type: object
      properties:
        diagnosticId: { type: string }
        mainPoints: { type: number, minimum: 0, maximum: 100 }
        alternativePoints: { type: number, minimum: 0, maximum: 100 }
        observations: { type: array, items: { $ref: "#/components/schemas/RubricObservation" } }
      required: [diagnosticId, mainPoints, alternativePoints, observations]
    ProfessorRubric:
      type: object
      properties:
        version: { type: string }
        revision: { type: integer, minimum: 1 }
        clinicalMaximum: { type: number, minimum: 0, maximum: 100 }
        diagnostics: { type: array, items: { $ref: "#/components/schemas/RubricDiagnostic" } }
      required: [version, revision, clinicalMaximum, diagnostics]
    RubricUpdateInput:
      type: object
      properties:
        revision: { type: integer, minimum: 1 }
        rubric: { $ref: "#/components/schemas/ProfessorRubric" }
      required: [revision, rubric]
    GradeDistributionBin:
      type: object
      properties:
        lower: { type: number }
        upper: { type: number }
        upperInclusive: { type: boolean }
        count: { type: integer }
        percentage: { type: number }
      required: [lower, upper, upperInclusive, count, percentage]
    GradeDistribution:
      type: object
      description: Effectifs anonymes sans identifiants, noms ou copies. Un brouillon ou une copie sans note est exclu, jamais remplacé par zéro.
      properties:
        maximum: { type: number }
        gradedCount: { type: integer }
        excludedCount: { type: integer }
        average: { type: [number, "null"] }
        median: { type: [number, "null"] }
        lowest: { type: [number, "null"] }
        highest: { type: [number, "null"] }
        bins: { type: array, items: { $ref: "#/components/schemas/GradeDistributionBin" } }
      required: [maximum, gradedCount, excludedCount, average, median, lowest, highest, bins]
    PrcSharingInput:
      type: object
      properties:
        username: { type: string, minLength: 1, maxLength: 80 }
        manageSessions: { type: boolean, default: false }
      required: [username]
    Collaborator:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        active: { type: boolean }
        manageSessions: { type: boolean }
      required: [id, username, manageSessions]
    PrcSharing:
      type: object
      properties:
        owner:
          type: object
          properties:
            id: { type: string }
            username: { type: string }
          required: [id, username]
        canShare: { type: boolean }
        collaborators: { type: array, items: { $ref: "#/components/schemas/Collaborator" } }
      required: [owner, canShare, collaborators]
    CollaborationRemoved:
      type: object
      properties:
        removed: { type: boolean }
      required: [removed]
