[build]
  command = "pnpm --filter @workspace/prc-pharmacie run build && pnpm --filter @workspace/api-server run build:netlify"
  publish = "artifacts/prc-pharmacie/dist/public"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.28.2"
  PORT = "5173"
  BASE_PATH = "/"

[functions]
  directory = "artifacts/prc-pharmacie/dist/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api?path=:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
